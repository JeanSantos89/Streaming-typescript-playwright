name: Playwright Tests
# nome que aparece na aba Actions

on:
  pull_request:
  push:
    branches: [ "main" ]  # executar quando mr para main

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10      # evita que o job fique preso indefinidamente

    steps:
      - uses: actions/checkout@v4
        # pega o código do repositório

      - uses: actions/setup-node@v4
        with:
          node-version: 20    # use a mesma versão do seu package.json
          cache: npm          # cache de dependências

      - name: Install dependencies
        run: npm ci          # instala deps usando lockfile

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps
        # essencial no runner Linux para ter chromium/firefox/webkit

      - name: Run tests
        env:
          CI: true
          BASE_URL: "https://www.themoviedb.org"  # URL base usada nos testes
        run: npx playwright test
        # se você configurou projects no config (por ex. apenas chromium)
        # este comando já respeitará. Pode passar --browser=chromium se
        # quiser sobrescrever.

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
        # garante que mesmo em falha o relatório fique disponível

      - name: Upload test results (JUnit, traces, etc)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 14

# você pode adicionar outros jobs (lint, build, etc.) conforme
# o projeto evoluir, mas para um repositório de testes esta configuração
# já resolve o essencial.