name: Playwright Tests
# nome que aparece na aba Actions
#
# Este repo não tem testes de API/backend (TMDB aqui é testado pela UI pública,
# não pela API oficial). O gate fica dividido em 3 jobs:
#   - assert-quality-audit: audita os specs em si (gate estático, sem navegador)
#   - e2e-guest: fluxos sem login (não precisa de secret, é o gate principal)
#   - e2e-authenticated: fluxos que fazem login de verdade no TMDB (precisa de
#     TMDB_USERNAME/TMDB_PASSWORD configurados em Settings > Secrets > Actions).
#     Este job é best-effort (continue-on-error): login automatizado contra
#     produção de um serviço de terceiro pode ser bloqueado pelo bot-detection
#     deles (AWS WAF), sem aviso, sem erro — só trava. Já aconteceu 2x. Não dá
#     para contornar a proteção deles (seria violar os termos de uso do TMDB),
#     então o job roda, mas não bloqueia o workflow. Detalhe no README.

on:
  pull_request:
  push:
    branches: [ "main" ]  # executar quando mr para main

jobs:
  assert-quality-audit:
    name: Auditoria de qualidade dos testes (gate estático)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Não precisa de secret nem de rede do TMDB: só lê os .ts dos specs e das
    # Page Objects. Roda independente dos outros dois jobs — se um teste
    # passa mas não prova nada (sem expect, ou assert tautológico tipo
    # expect(true).toBe(true)), este job falha mesmo que e2e-guest/
    # e2e-authenticated fiquem verdes.

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit test quality
        run: node scripts/audit-test-quality.js

  e2e-guest:
    name: E2E (visitante, sem login)
    runs-on: ubuntu-latest
    timeout-minutes: 30      # evita que o job fique preso indefinidamente

    steps:
      - uses: actions/checkout@v4
        # pega o código do repositório

      - uses: actions/setup-node@v4
        with:
          node-version: 20    # use a mesma versão do seu package.json
          cache: npm          # cache de dependências

      - name: Install dependencies
        run: npm ci          # instala deps usando lockfile

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium
        # essencial no runner Linux para ter o chromium

      - name: Run guest-only tests
        env:
          CI: true
          # globalSetup exige as duas vars mesmo nos testes sem login;
          # valor fictício é suficiente pois nenhum destes testes faz login de fato.
          TMDB_USERNAME: guest-gate-placeholder
          TMDB_PASSWORD: guest-gate-placeholder
        run: npx playwright test --grep-invert "logado|Login|watchlist"

      - name: Upload HTML report (guest)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-guest
          path: evidence/report/
          retention-days: 14
          if-no-files-found: warn

      - name: Upload test results (guest)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-guest
          path: evidence/test-results/
          retention-days: 14
          if-no-files-found: warn

  e2e-authenticated:
    name: E2E (autenticado, best-effort — não bloqueia o workflow)
    runs-on: ubuntu-latest
    # Timeout curto de propósito: login real no TMDB (produção de terceiro)
    # pode ser travado pelo bot-detection (AWS WAF) deles, sem sinal de erro
    # nem de conclusão — já aconteceu 2x (ficou >15min parado em "Run
    # authenticated tests" e precisou ser cancelado na mão). 5 minutos é
    # tempo de sobra para um login real que funciona; se passar disso, é
    # bloqueio do WAF, não lentidão do teste, e falhar rápido é melhor do
    # que ficar pendurado até o timeout padrão de 1h.
    timeout-minutes: 5
    # Best-effort: uma falha aqui (inclusive timeout) não derruba o workflow
    # geral. TMDB é produção de terceiro fora do nosso controle, e burlar a
    # proteção anti-bot deles não é opção. Quem bloqueia de verdade é
    # assert-quality-audit e e2e-guest.
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Check TMDB credentials are configured
        run: |
          if [ -z "${{ secrets.TMDB_USERNAME }}" ] || [ -z "${{ secrets.TMDB_PASSWORD }}" ]; then
            echo "::error::Faltam os secrets TMDB_USERNAME/TMDB_PASSWORD neste repositório."
            echo "::error::Configure em Settings > Secrets and variables > Actions antes de confiar neste gate."
            exit 1
          fi

      - name: Run authenticated tests
        # Best-effort: timeout curto acima + continue-on-error no job inteiro
        # existem porque este login é contra produção real do TMDB, que tem
        # anti-bot ativo (AWS WAF). Já travou 2x sem dar sinal de erro. Este
        # step pode falhar ou estourar o timeout sem derrubar o workflow.
        env:
          CI: true
          TMDB_USERNAME: ${{ secrets.TMDB_USERNAME }}
          TMDB_PASSWORD: ${{ secrets.TMDB_PASSWORD }}
        run: npx playwright test --grep "logado|Login|watchlist"

      - name: Upload HTML report (authenticated)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-authenticated
          path: evidence/report/
          retention-days: 14
          if-no-files-found: warn

      - name: Upload test results (authenticated)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-authenticated
          path: evidence/test-results/
          retention-days: 14
          if-no-files-found: warn

# você pode adicionar outros jobs (lint, build, etc.) conforme
# o projeto evoluir, mas para um repositório de testes esta configuração
# já resolve o essencial.
