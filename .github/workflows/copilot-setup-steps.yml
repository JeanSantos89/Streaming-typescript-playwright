name: "Copilot Setup Steps"

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Build application
        run: npm run build

      - name: Run Playwright tests
        run: npx playwright test
        env:
          CI: true
          BASE_URL: https://www.themoviedb.org
          TMDB_USER: ${{ secrets.TMDB_USER }}
          TMDB_PASSWORD: ${{ secrets.TMDB_PASSWORD }}

      # 🔎 Debug: confirma que os arquivos existem (útil quando der "não achei")
      - name: List Playwright evidence files
        if: always()
        run: |
          echo "PWD: $(pwd)"
          ls -la
          echo "---- evidence ----"
          find evidence -maxdepth 5 -type f | sed -n '1,200p'

      # ✅ Upload: é AQUI que vai aparecer em "Artifacts" no run
      - name: Upload Playwright evidence (screenshots/videos/traces)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-evidence
          path: evidence/
          if-no-files-found: error
          retention-days: 7

      # (Opcional) Se você também quiser subir report HTML quando existir
      - name: Upload Playwright HTML report (if any)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: warn
          retention-days: 7